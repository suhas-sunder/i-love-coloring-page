name: Release Quality Gate

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "reports/**"
      - "pipeline/review/**"
  push:
    branches:
      - main
    paths-ignore:
      - "reports/**"
      - "pipeline/review/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-quality-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Deterministic release verification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run deterministic release quality gate
        run: npm run verify:release
