# Netlify deploys the public gallery as a static frontend.
# Public defaults are built into the static site and do not require Netlify env vars:
# - NEXT_PUBLIC_SITE_URL defaults to https://www.ilovecoloringpage.com
# - NEXT_PUBLIC_COLORING_ASSET_BASE_URL defaults to https://assets.ilovecoloringpage.com/coloring-pages
# Optional public overrides:
# - NEXT_PUBLIC_SITE_URL
# - NEXT_PUBLIC_COLORING_ASSET_BASE_URL
# - NEXT_PUBLIC_SITE_NAME
# Eligible pages always emit the centralized AdSense units. Neutral placeholders
# are status-driven fallbacks for failed, timed-out, or all-unfilled requests.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/build-revision.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/plain; charset=UTF-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/image-sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/search-data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
